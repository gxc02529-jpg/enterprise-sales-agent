name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sales_agent
          POSTGRES_PASSWORD: sales_agent
          POSTGRES_DB: sales_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sales_agent -d sales_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,observability]"
          pip install "asyncpg>=0.30,<1"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://sales_agent:sales_agent@localhost:5432/sales_agent

      - name: RAG evaluation CLI smoke
        run: >-
          python -m sales_agent.evaluation.rag
          --dataset evaluations/rag/mock-smoke.jsonl
          --allow-mock
          --min-recall 1
          --min-mrr 1
          --output build/reports/rag-eval-smoke.json
