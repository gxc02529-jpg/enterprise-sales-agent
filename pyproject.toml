[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-sales-agent"
version = "0.1.0"
description = "Enterprise sales analytics agent scaffold based on LangGraph and FastMCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "langgraph>=1.2,<1.3",
  "fastmcp>=4.0,<5",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "structlog>=25.4,<26",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
infra = [
  "asyncpg>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "redis[hiredis]>=6.4,<7",
  "pymilvus>=3.0,<4",
  "nebula3-python>=3.8,<4",
]
llm = [
  "langchain-openai>=0.3,<1",
]
rag = [
  "FlagEmbedding>=1.3,<2",
  "rank-bm25>=0.2,<1",
]
documents = [
  "pypdf>=6.0,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
]
observability = [
  "prometheus-client>=0.21,<1",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
sales-agent-api = "sales_agent.api:run"
sales-agent-mcp = "sales_agent.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
